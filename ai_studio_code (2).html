<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StockSense — Intelligent Inventory Management & Decision Support</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM (UMD) -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- In-browser JSX Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    @keyframes emoji-wave {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(14deg); }
      40% { transform: rotate(-14deg); }
      60% { transform: rotate(10deg); }
      80% { transform: rotate(-4deg); }
    }
    @keyframes emoji-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    @keyframes emoji-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.18); }
    }
    @keyframes emoji-rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes emoji-float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-6px) rotate(3deg); }
    }
    @keyframes emoji-shake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-4px) rotate(-4deg); }
      40% { transform: translateX(4px) rotate(4deg); }
      60% { transform: translateX(-3px) rotate(-2deg); }
      80% { transform: translateX(3px) rotate(2deg); }
    }
    @keyframes emoji-heartbeat {
      0%, 100% { transform: scale(1); }
      15% { transform: scale(1.22); }
      30% { transform: scale(1); }
      45% { transform: scale(1.15); }
    }

    .anim-wave { animation: emoji-wave 1.8s infinite ease-in-out; }
    .anim-bounce { animation: emoji-bounce 1.5s infinite ease-in-out; }
    .anim-pulse { animation: emoji-pulse 1.6s infinite ease-in-out; }
    .anim-rotate { animation: emoji-rotate 4s infinite linear; }
    .anim-float { animation: emoji-float 2.4s infinite ease-in-out; }
    .anim-shake { animation: emoji-shake 1.2s infinite ease-in-out; }
    .anim-heartbeat { animation: emoji-heartbeat 1.4s infinite ease-in-out; }
    .anim-idle { transition: transform 0.25s ease; }
    .anim-idle:hover { transform: scale(1.25) translateY(-2px); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const TABS = [
      { id: 'dashboard', label: 'Dashboard', emoji: '👋', secondaryEmoji: '📊', animation: 'anim-wave', badge: 'Live' },
      { id: 'products', label: 'Products', emoji: '📦', secondaryEmoji: '🏷️', animation: 'anim-bounce', badge: '1,248' },
      { id: 'receipts', label: 'Receipts / Inbound', emoji: '📥', secondaryEmoji: '🚚', animation: 'anim-bounce', badge: '3 pending' },
      { id: 'deliveries', label: 'Delivery Orders', emoji: '📤', secondaryEmoji: '🚛', animation: 'anim-pulse', badge: '12 ready' },
      { id: 'transfers', label: 'Internal Transfers', emoji: '🔄', secondaryEmoji: '📦', animation: 'anim-rotate', badge: '4 active' },
      { id: 'adjustments', label: 'Adjustments', emoji: '🛠️', secondaryEmoji: '✏️', animation: 'anim-shake' },
      { id: 'ledger', label: 'Stock Ledger', emoji: '📚', secondaryEmoji: '🧾', animation: 'anim-float' },
      { id: 'warehouses', label: 'Warehouses', emoji: '🏭', secondaryEmoji: '🏢', animation: 'anim-pulse', badge: '3 sites' },
      { id: 'analytics', label: 'Analytics', emoji: '📈', secondaryEmoji: '🔍', animation: 'anim-float', badge: 'Pro' },
      { id: 'forecasts', label: 'Predictive Forecasts', emoji: '🔮', secondaryEmoji: '📉', animation: 'anim-float', badge: 'AI' },
      { id: 'health', label: 'Stock Health', emoji: '❤️', secondaryEmoji: '🩺', animation: 'anim-heartbeat', badge: '98.4%' },
      { id: 'suppliers', label: 'Suppliers', emoji: '🤝', secondaryEmoji: '🚚', animation: 'anim-pulse', badge: '28 active' },
      { id: 'autopilot', label: 'Inventory Autopilot', emoji: '🚀', secondaryEmoji: '🤖', animation: 'anim-bounce', badge: 'Active' },
      { id: 'notifications', label: 'Alerts & Activity', emoji: '🔔', secondaryEmoji: '⚡', animation: 'anim-shake', badge: '5 new' },
      { id: 'settings', label: 'Settings', emoji: '⚙️', secondaryEmoji: '🛠️', animation: 'anim-rotate' },
    ];

    const METRICS = [
      { title: 'Total SKUs', value: '1,428', change: '+12.4%', emoji: '📦', anim: 'anim-bounce' },
      { title: 'Inventory Valuation', value: '$842,500', change: '+4.8%', emoji: '💎', anim: 'anim-pulse' },
      { title: 'Stockout Risk Alert', value: '3 Items', change: '-2 items', alert: true, emoji: '🚨', anim: 'anim-shake' },
      { title: 'Warehouse Health', value: '98.2%', change: '+0.6%', emoji: '❤️', anim: 'anim-heartbeat' },
    ];

    const PRODUCTS = [
      { id: 'SKU-8921', name: 'Ergonomic Mechanical Keyboard', stock: 142, warehouse: 'Main Hub - WH1', status: 'Optimal', emoji: '📦', price: '$129.00' },
      { id: 'SKU-4402', name: 'Ultra-Wide 34" Curved Monitor', stock: 12, warehouse: 'West Coast - WH2', status: 'Low Stock', emoji: '⚠️', price: '$599.00' },
      { id: 'SKU-1084', name: 'Noise-Cancelling Studio Headphones', stock: 0, warehouse: 'East DC - WH3', status: 'Stockout', emoji: '🚨', price: '$249.00' },
      { id: 'SKU-7731', name: 'USB-C Multi-Port Thunderbolt Dock', stock: 88, warehouse: 'Main Hub - WH1', status: 'Optimal', emoji: '📦', price: '$89.00' },
      { id: 'SKU-9023', name: 'Smart Wireless Charging Mat', stock: 320, warehouse: 'South Hub - WH4', status: 'Overstocked', emoji: '📊', price: '$39.00' },
    ];

    function AnimatedEmoji({ emoji, animation = 'anim-wave', size = 'text-2xl' }) {
      const [popped, setPopped] = useState(false);
      return (
        <span 
          onClick={() => { setPopped(true); setTimeout(() => setPopped(false), 500); }}
          className={`inline-block select-none cursor-pointer transform transition-transform duration-200 ${size} ${popped ? 'scale-150 rotate-12' : animation}`}
        >
          {emoji}
        </span>
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('dashboard');
      const [searchQuery, setSearchQuery] = useState('');
      const [toast, setToast] = useState(null);

      const notify = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const currentTab = TABS.find(t => t.id === activeTab) || TABS[0];

      return (
        <div className="flex h-screen bg-slate-950 text-slate-100 overflow-hidden">
          {/* Sidebar */}
          <aside className="w-72 bg-slate-900 border-r border-slate-800 flex flex-col">
            <div className="p-5 border-b border-slate-800 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center">
                  <AnimatedEmoji emoji="⚡" animation="anim-pulse" size="text-xl" />
                </div>
                <div>
                  <h1 className="font-bold text-white text-base">StockSense</h1>
                  <p className="text-xs text-slate-400">Inventory Telemetry</p>
                </div>
              </div>
              <span className="text-[10px] bg-indigo-500/20 text-indigo-400 font-semibold px-2 py-0.5 rounded-full border border-indigo-500/30">v2.4</span>
            </div>

            <nav className="flex-1 overflow-y-auto p-3 space-y-1">
              {TABS.map((tab) => {
                const isActive = activeTab === tab.id;
                return (
                  <button
                    key={tab.id}
                    onClick={() => { setActiveTab(tab.id); notify(`Navigated to ${tab.label}`); }}
                    className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-sm font-medium transition-all ${
                      isActive ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/30' : 'text-slate-400 hover:text-white hover:bg-slate-800/70'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <span className="w-7 flex justify-center text-lg">
                        <AnimatedEmoji emoji={isActive ? tab.emoji : tab.secondaryEmoji} animation={isActive ? tab.animation : 'anim-idle'} size="text-lg" />
                      </span>
                      <span>{tab.label}</span>
                    </div>
                    {tab.badge && (
                      <span className={`text-[10px] px-2 py-0.5 rounded-full font-semibold ${
                        isActive ? 'bg-white/20 text-white' : 'bg-slate-800 text-slate-400 border border-slate-700'
                      }`}>
                        {tab.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </nav>
          </aside>

          {/* Main Area */}
          <main className="flex-1 flex flex-col overflow-hidden">
            <header className="h-16 bg-slate-900/60 border-b border-slate-800 px-8 flex items-center justify-between">
              <div className="flex items-center gap-4">
                <AnimatedEmoji emoji={currentTab.emoji} animation={currentTab.animation} size="text-3xl" />
                <h2 className="text-lg font-semibold text-white flex items-center gap-2">
                  {currentTab.label}
                  <span className="text-xs font-normal text-slate-400 border border-slate-800 bg-slate-800/60 px-2 py-0.5 rounded-md">Live View</span>
                </h2>
              </div>
              <div className="flex items-center gap-3">
                <button onClick={() => notify('🔔 Real-time alerts synced!')} className="w-9 h-9 rounded-lg bg-slate-800 border border-slate-700 flex items-center justify-center hover:bg-slate-700">
                  <AnimatedEmoji emoji="🔔" animation="anim-shake" size="text-base" />
                </button>
                <button onClick={() => notify('🚀 Reorder forecast calculated!')} className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold px-3 py-2 rounded-lg flex items-center gap-1.5 shadow-md shadow-indigo-600/30">
                  <AnimatedEmoji emoji="⚡" animation="anim-pulse" size="text-sm" />
                  Quick Action
                </button>
              </div>
            </header>

            <div className="flex-1 overflow-y-auto p-8 space-y-8">
              {/* Metrics */}
              <div className="grid grid-cols-1 md:grid-cols-4 gap-5">
                {METRICS.map((m, idx) => (
                  <div key={idx} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 hover:border-slate-700 transition">
                    <div className="flex items-center justify-between mb-3">
                      <span className="text-xs font-medium text-slate-400">{m.title}</span>
                      <AnimatedEmoji emoji={m.emoji} animation={m.anim} size="text-lg" />
                    </div>
                    <div className="flex items-baseline gap-2">
                      <span className="text-2xl font-bold text-white">{m.value}</span>
                      <span className={`text-xs font-semibold ${m.alert ? 'text-rose-400' : 'text-emerald-400'}`}>{m.change}</span>
                    </div>
                  </div>
                ))}
              </div>

              {/* Data Table */}
              <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                <div className="p-5 border-b border-slate-800 flex items-center justify-between">
                  <div className="flex items-center gap-2 font-semibold text-white text-sm">
                    <AnimatedEmoji emoji="📋" animation="anim-float" size="text-lg" />
                    <span>Real-time Stock Inventory & Status</span>
                  </div>
                </div>
                <table className="w-full text-left text-xs">
                  <thead className="bg-slate-950/60 text-slate-400 border-b border-slate-800 uppercase tracking-wider font-semibold">
                    <tr>
                      <th className="py-3 px-5">Item & SKU</th>
                      <th className="py-3 px-5">Warehouse</th>
                      <th className="py-3 px-5">Unit Price</th>
                      <th className="py-3 px-5">Quantity</th>
                      <th className="py-3 px-5">Status</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800 text-slate-300">
                    {PRODUCTS.map(p => (
                      <tr key={p.id} className="hover:bg-slate-800/40">
                        <td className="py-3.5 px-5 flex items-center gap-3">
                          <AnimatedEmoji emoji={p.emoji} animation="anim-bounce" size="text-sm" />
                          <div>
                            <div className="font-medium text-white">{p.name}</div>
                            <div className="text-[10px] text-slate-500 font-mono">{p.id}</div>
                          </div>
                        </td>
                        <td className="py-3.5 px-5 text-slate-400">{p.warehouse}</td>
                        <td className="py-3.5 px-5 font-mono text-slate-200">{p.price}</td>
                        <td className="py-3.5 px-5 font-semibold text-white">{p.stock} units</td>
                        <td className="py-3.5 px-5">
                          <span className={`px-2.5 py-1 rounded-full text-[10px] font-semibold border ${
                            p.status === 'Optimal' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/30' :
                            p.status === 'Low Stock' ? 'bg-amber-500/10 text-amber-400 border-amber-500/30' : 'bg-rose-500/10 text-rose-400 border-rose-500/30'
                          }`}>
                            {p.status}
                          </span>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          </main>

          {/* Toast */}
          {toast && (
            <div className="fixed bottom-6 right-6 bg-slate-900 border border-indigo-500/50 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
              <span className="text-xl">✨</span>
              <p className="text-xs font-medium">{toast}</p>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
